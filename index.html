<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Music</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- GSAP -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
    </script>

</head>

<body>

<div id="app">


    <!-- =====================================================
         TOP NAVIGATION
    ====================================================== -->

    <nav class="top-nav">

        <button
            class="category-btn active"
            data-category="trending"
            type="button"
        >
            PURULIA
        </button>

        <button
            class="category-btn"
            data-category="old"
            type="button"
        >
            OLD SONGS
        </button>

        <button
            class="category-btn"
            data-category="new"
            type="button"
        >
            NEW SONGS
        </button>

        <button
            class="category-btn"
            data-category="dance"
            type="button"
        >
            DANCE SONGS
        </button>

        <button
            class="category-btn"
            data-category="bengali"
            type="button"
        >
            BENGALI SONGS
        </button>

    </nav>


    <!-- =====================================================
         HERO
    ====================================================== -->

    <main class="hero">

        <div class="hero-content">


            <!-- =================================================
                 SINGLE ROUND MUSIC / VOLUME CONTROL
            ================================================== -->

            <div
                class="hero-round-control"
                id="heroRoundControl"
                aria-label="Volume control"
                title="Clockwise: volume up | Anti-clockwise: volume down"
            >

                <svg
                    class="volume-ring"
                    viewBox="0 0 100 100"
                    aria-hidden="true"
                >

                    <!-- Faint full ring -->
                    <circle
                        class="volume-ring-track"
                        cx="50"
                        cy="50"
                        r="43"
                    ></circle>


                    <!-- White volume ring -->
                    <circle
                        class="volume-ring-progress"
                        id="volumeRingProgress"
                        cx="50"
                        cy="50"
                        r="43"
                    ></circle>

                </svg>


                <!-- ONLY ONE MUSIC ICON -->
                <span class="hero-round-note">
                    ♪
                </span>

            </div>


            <!-- HERO TITLE -->

            <h1>
                MUSIC
            </h1>


            <!-- HERO SUBTITLE -->

            <p>
                YOUR MUSIC JOURNEY
            </p>

        </div>

    </main>


    <!-- =====================================================
         PLAYLIST
    ====================================================== -->

    <section
        class="playlist-panel"
        id="playlistPanel"
    >

        <!-- PLAYLIST HEADER -->

        <div
            class="playlist-header"
            id="playlistHeader"
        >

            <div>

                <span class="playlist-label">
                    MUSIC
                </span>

                <h2 id="playlistTitle">
                    PURULIA
                </h2>

            </div>


            <div class="playlist-header-right">

                <span id="playlistCount">
                    LOADING
                </span>


                <button
                    class="playlist-toggle"
                    id="playlistToggle"
                    type="button"
                    aria-label="Toggle playlist"
                >
                    +
                </button>

            </div>

        </div>


        <!-- PLAYLIST CONTENT -->

        <div
            class="playlist-content"
            id="playlistContent"
        >

            <div
                class="playlist-items"
                id="playlistItems"
            >

                <div class="playlist-loading">
                    LOADING...
                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         MUSIC PLAYER
    ====================================================== -->

    <section
        class="music-player"
        id="musicPlayer"
    >

        <!-- CURRENT SONG -->

        <div class="player-song">

            <div class="player-icon">
                ♪
            </div>


            <div class="player-info">

                <div
                    id="trackTitle"
                    class="player-title"
                >
                    Music
                </div>


                <div
                    id="trackArtist"
                    class="player-artist"
                >
                    YouTube Music
                </div>

            </div>

        </div>


        <!-- PLAYER CONTROLS -->

        <div class="player-controls">

            <button
                id="previousBtn"
                type="button"
                aria-label="Previous song"
            >
                ◀
            </button>


            <button
                id="playBtn"
                class="main-play"
                type="button"
                aria-label="Play or pause"
            >
                ▶
            </button>


            <button
                id="nextBtn"
                type="button"
                aria-label="Next song"
            >
                ▶
            </button>


            <button
                id="volumeBtn"
                type="button"
                aria-label="Mute or unmute"
            >
                🔊
            </button>

        </div>


        <!-- VISUALIZER -->

        <div
            class="visualizer"
            id="visualizer"
            aria-hidden="true"
        >

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- PROGRESS -->

        <div class="progress-area">

            <span id="currentTime">
                00:00
            </span>


            <div
                class="progress"
                id="progress"
            >

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>


            <span id="duration">
                00:00
            </span>

        </div>

    </section>


    <!-- =====================================================
         HIDDEN YOUTUBE PLAYER
    ====================================================== -->

    <div
        id="youtube-player"
        class="youtube-player"
    ></div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div
        id="status"
        class="status"
    ></div>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script src="script.js"></script>

</body>

</html>
